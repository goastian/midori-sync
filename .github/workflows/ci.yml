name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    name: PHP — PostgreSQL ${{ matrix.postgres }} tests + audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        postgres: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: midori_sync_test
          POSTGRES_USER: midori_sync_test
          POSTGRES_PASSWORD: midori-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U midori_sync_test -d midori_sync_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: midori_sync_test
      DB_USERNAME: midori_sync_test
      DB_PASSWORD: midori-ci-only
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_pgsql, pgsql, pcntl, sodium
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          # Quiet config defaults that are not exercised in tests.
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=array/' .env
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=array/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: PHPUnit
        run: php artisan test

      - name: composer audit
        run: composer audit --no-interaction --abandoned=report

  js:
    name: JS — dashboard build + audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build dashboard
        run: npm run build

      - name: npm audit (high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: false
