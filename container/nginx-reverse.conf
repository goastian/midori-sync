# Midori Sync — vhost de borde (placeholder: sync.example.com). Escucha
# solo :80; certbot añade :443 y las directivas ssl.
# Instalar en /etc/nginx/vhosts.d/midori-sync.conf, luego:
#   nginx -t && systemctl reload nginx && certbot --nginx -d sync.example.com
#
# El Pod publica la app en 127.0.0.1:2004 (ver container/setup.sh); no se
# expone directo a Internet, solo este borde lo alcanza. Aquí viven TLS,
# cabeceras, CSP y límites por IP; el nginx interno del contenedor solo
# sirve la app en :8080.

limit_req_zone  $binary_remote_addr zone=midori_public:10m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=midori_api:10m    rate=50r/s;
limit_req_zone  $binary_remote_addr zone=midori_auth:10m   rate=5r/s;
limit_conn_zone $binary_remote_addr zone=midori_conn:10m;
# limit_req_status/limit_conn_status NO se declaran aquí: ya los fija
# ads.conf a nivel del bloque http compartido (vhosts.d/*.conf se
# concatenan ahí); declararlos de nuevo rompe "nginx -t" (duplicate
# directive).

server {
    listen 80;
    listen [::]:80;
    server_name sync.example.com;

    server_tokens off;
    access_log /var/log/nginx/midori-sync.access.log;
    error_log  /var/log/nginx/midori-sync.error.log;

    client_max_body_size 10m;
    limit_conn midori_conn 100;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # Defensa en profundidad (el nginx interno también bloquea esto).
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(?:bak|conf|dist|dump|env|ini|log|orig|save|sh|sql|swp|tar)$ { deny all; }
    location ~ ~$ { deny all; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Única entrada confiable: se SOBRESCRIBE cualquier X-Forwarded-For del
    # cliente (evita spoofing de IP).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_redirect off;

    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Stream de notificaciones nativas: sin buffering, timeout largo.
    location = /api/v1/sync/notifications/stream {
        access_log off;
        limit_req zone=midori_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:2004;
        proxy_buffering off;
        proxy_read_timeout 75s;
    }

    # Autenticación / pairing nativo: límite agresivo (anti-fuerza bruta).
    location ~* ^/(login|register|auth/|api/v1/pair/|api/v1/sessions) {
        limit_req zone=midori_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:2004;
    }

    location ^~ /api/ {
        limit_req zone=midori_api burst=80 nodelay;
        proxy_pass http://127.0.0.1:2004;
    }

    location / {
        limit_req zone=midori_public burst=40 nodelay;
        proxy_pass http://127.0.0.1:2004;
    }
}
