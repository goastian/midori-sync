[www]
user = nginx
group = nginx

listen = 127.0.0.1:9000
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

; Ajustado tras pruebas de estrés (2026-10-30). Historial:
;  - 20 children / 1.5 cpu: saturaba a 30 clientes concurrentes.
;  - 10 children / 1.8 cpu: saturaba igual a 30 clientes (techo de CPU).
;  - 18 children / 3.2 cpu: dimensionado para >50 clientes concurrentes.
; Mantener la proporcion (~5.5 children por vCPU) si --cpus vuelve a cambiar.
pm = dynamic
pm.max_children = 18
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 9
pm.max_requests = 500

; Requisito de Laravel: hereda el entorno del contenedor (EnvironmentFile).
clear_env = no
catch_workers_output = yes
