user nginx;
worker_processes auto;
pid /run/nginx.pid;

error_log /dev/stderr warn;
worker_rlimit_nofile 4096;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    log_format midori_safe '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout midori_safe;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 20s;
    keepalive_requests 100;
    reset_timedout_connection on;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        font/woff2
        image/svg+xml
        text/css
        text/plain;

    upstream php-fpm {
        server 127.0.0.1:9000;
        keepalive 32;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;

        # Bloquear ficheros ocultos (.env, .git, etc.), salvo /.well-known/
        # por si el borde reenvía aquí algún reto ACME.
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Bloquear extensiones sensibles.
        location ~* \.(?:bak|conf|dist|dump|env|fla|in[ci]|log|orig|php~|save|sh|sql|swp|tar|tpl|wad|xtmpl)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Nunca ejecutar PHP dentro del almacenamiento público de subidas.
        location ~ ^/storage/.*\.php$ {
            deny all;
            access_log off;
        }
        location ^~ /storage/framework/ { deny all; }
        location ^~ /storage/logs/ { deny all; }

        # Directorios del framework no expuestos en runtime.
        location ^~ /app/ { deny all; }
        location ^~ /bootstrap/ { deny all; }
        location ^~ /config/ { deny all; }
        location ^~ /database/ { deny all; }
        location ^~ /routes/ { deny all; }
        location ^~ /vendor/ { deny all; }

        # Stream de notificaciones nativas de Sync (SSE de larga duración,
        # servido por "php artisan sync:notifications" en 127.0.0.1:8765).
        location = /api/v1/sync/notifications/stream {
            access_log off;
            proxy_pass http://127.0.0.1:8765;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 75s;
            proxy_send_timeout 10s;
        }

        # Front controller de Laravel.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Assets estáticos firmados por Vite: caché larga.
        location ~* \.(?:css|js|gif|jpe?g|png|svg|webp|avif|ico|woff2?|ttf|eot|map)$ {
            try_files $uri =404;
            expires 30d;
            access_log off;
            log_not_found off;
        }

        # PHP-FPM (reverse proxy hacia el upstream).
        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            fastcgi_keep_conn on;

            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            # Mitiga el CVE de inyección HTTP_PROXY.
            fastcgi_param HTTP_PROXY "";

            fastcgi_connect_timeout 5s;
            fastcgi_send_timeout 120s;
            fastcgi_read_timeout 120s;

            fastcgi_buffers 256 16k;
            fastcgi_buffer_size 128k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_temp_file_write_size 256k;

            fastcgi_hide_header X-Powered-By;
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }

        location = /robots.txt {
            access_log off;
            log_not_found off;
        }
    }
}
