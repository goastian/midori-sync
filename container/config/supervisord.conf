[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
umask=022

[program:php-fpm]
command=php-fpm85 -F
priority=10
autostart=true
autorestart=true
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
command=/usr/local/bin/midori-queue-worker
directory=/var/www/html
user=nginx
priority=30
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=100
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Sin programa "scheduler" a propósito: "schedule:work" necesita
; proc_open para lanzar cada tarea (sync:cleanup-expired,
; sync:recalculate-usage) como proceso aparte, y proc_open está en
; disable_functions (shell-less) — crasheaba cada minuto por esto. Las
; tareas reales de routes/console.php se siguen ejecutando, pero vía
; "podman exec" desde un timer systemd --user en el HOST (ver
; container/systemd/midori-sync-scheduler.{service,timer}), no dentro
; del contenedor.

[program:sync-notifications]
command=php artisan sync:notifications
directory=/var/www/html
user=nginx
priority=50
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
