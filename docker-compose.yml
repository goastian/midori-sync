services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8080"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-midori_sync}
      - DB_USERNAME=${DB_USERNAME:-midori}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID}
      - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET}
      - AUTHENTIK_BASE_URL=${AUTHENTIK_BASE_URL}
      - SYNC_TOKEN_TTL=${SYNC_TOKEN_TTL:-3600}
      - LIBRARY_BILLING_ENABLED=${LIBRARY_BILLING_ENABLED:-true}
      - PAYMENTS_BASE_URL=${PAYMENTS_BASE_URL:-https://payments.astian.org}
      - PAYMENTS_API_TOKEN=${PAYMENTS_API_TOKEN}
      - PAYMENTS_WEBHOOK_SECRET=${PAYMENTS_WEBHOOK_SECRET}
      - PAYMENTS_UPGRADE_URL=${PAYMENTS_UPGRADE_URL}
      - LIBRARY_FETCH_ENABLED=${LIBRARY_FETCH_ENABLED:-true}
      - LIBRARY_SNAPSHOTS_ENABLED=${LIBRARY_SNAPSHOTS_ENABLED:-true}
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Worker A — metadata (ligero, escalable). Cola: fetch
  worker-fetch:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan queue:work redis --queue=fetch,default --sleep=1 --tries=3 --backoff=60
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-midori_sync}
      - DB_USERNAME=${DB_USERNAME:-midori}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2

  # Worker B — snapshots (pesado; el screenshot/PDF con Chromium vive aquí en L3-full)
  worker-snapshot:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan queue:work redis --queue=snapshots --sleep=2 --tries=2 --backoff=120
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-midori_sync}
      - DB_USERNAME=${DB_USERNAME:-midori}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - LIBRARY_SNAPSHOTS_ENABLED=${LIBRARY_SNAPSHOTS_ENABLED:-true}
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-midori_sync}
      POSTGRES_USER: ${DB_USERNAME:-midori}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-midori} -d ${DB_DATABASE:-midori_sync}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:
